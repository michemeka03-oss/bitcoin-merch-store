function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem("user_email") !== null);
  const [userEmail, setUserEmail] = useState(() => localStorage.getItem("user_email") || "");
  const [page, setPage] = useState("home");
  const [cart, setCart] = useState([]);
  const [paymentMethod, setPaymentMethod] = useState("BTC");
  const [showSpin, setShowSpin] = useState(true);
  const [showChat, setShowChat] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [menuView, setMenuView] = useState("main");
  const [searchQuery, setSearchQuery] = useState("");
  const [activeCategory, setActiveCategory] = useState("All");
  const [showSearch, setShowSearch] = useState(false);
  
  const [authMode, setAuthMode] = useState("login"); 
  const [authError, setAuthError] = useState("");
  const [animatingId, setAnimatingId] = useState(null);

  useEffect(() => {
    const saved = localStorage.getItem("crypto_cart");
    if (saved) setCart(JSON.parse(saved));
  }, []);

  useEffect(() => {
    localStorage.setItem("crypto_cart", JSON.stringify(cart));
  }, [cart]);

  const handleAddToCart = (product) => {
    if (animatingId === product.id) return;
    setAnimatingId(product.id);
    
    setTimeout(() => {
      setAnimatingId("added");
      setCart(prev => [...prev, product]);
      
      setTimeout(() => {
        setAnimatingId(null);
      }, 1000);
    }, 600);
  };

  const clearCart = () => setCart([]);
  const total = cart.reduce((sum, item) => sum + item.price, 0);

  const handleAuth = (e) => {
    e.preventDefault();
    const email = e.target.elements.email.value;
    const password = e.target.elements.password.value;
    setAuthError("");

    if (authMode === "signup") {
      const users = JSON.parse(localStorage.getItem("registered_users") || "{}");
      if (users[email]) {
        setAuthError("Email already exists. Please sign in.");
        return;
      }
      users[email] = password;
      localStorage.setItem("registered_users", JSON.stringify(users));
      localStorage.setItem("user_email", email);
      setUserEmail(email);
      setIsLoggedIn(true);
    } else {
      const users = JSON.parse(localStorage.getItem("registered_users") || "{}");
      if (!users[email]) {
        setAuthError("No account found. Please create one.");
        return;
      }
      if (users[email] !== password) {
        setAuthError("Incorrect password.");
        return;
      }
      localStorage.setItem("user_email", email);
      setUserEmail(email);
      setIsLoggedIn(true);
    }
  };

  const handleLogout = () => {
    localStorage.removeItem("user_email");
    setUserEmail("");
    setIsLoggedIn(false);
    setAuthMode("login");
  };

  const handleMenuClick = (category) => {
    setShowMenu(false);
    setPage("home");
    setActiveCategory(category);
  };

  const filteredProducts = allProducts.filter(p => {
    const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
    const matchesCategory = activeCategory === "All" || p.category === activeCategory;
    return matchesSearch && matchesCategory;
  });

  if (!isLoggedIn) {
    return (
      <div className="min-h-screen bg-dark-bg flex flex-col items-center justify-center p-6 text-white">
        <div className="mb-12 text-center">
          <div className="flex items-center justify-center gap-2 font-black text-5xl mb-2 tracking-tighter">

            <div className="flex flex-col leading-none text-left"><span>itcoin</span><span className="text-3xl">merch</span></div>
          </div>
        </div>
        <div className="bg-[#242424] p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-white">{authMode === "login" ? "Sign in" : "Create Account"}</h2>
            <button 
              onClick={() => { setAuthMode(authMode === "login" ? "signup" : "login"); setAuthError(""); }}
              className="text-xs font-bold text-brand-orange hover:underline"
            >
              {authMode === "login" ? "Create one" : "Sign in"}
            </button>
          </div>
          
          {authError && <div className="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded mb-4 text-sm font-medium">{authError}</div>}
          
          <form onSubmit={handleAuth} className="space-y-4">
            <input type="email" name="email" placeholder="Email Address" required className="w-full border border-gray-600 p-3 rounded-lg outline-none focus:border-brand-orange bg-[#1a1a1a] text-white placeholder-gray-400" />
            <input type="password" name="password" placeholder="Password" required className="w-full border border-gray-600 p-3 rounded-lg outline-none focus:border-brand-orange bg-[#1a1a1a] text-white placeholder-gray-400" />
            <button type="submit" className="w-full bg-[#6b46c1] hover:bg-[#553c9a] text-white font-bold py-3 rounded-lg transition">
              {authMode === "login" ? "Continue with shop" : "Sign Up"}
            </button>
          </form>
          
          <div className="flex items-center my-6">
            <div className="flex-1 border-t border-gray-600"></div>
            <span className="px-3 text-gray-500 text-sm">or</span>
            <div className="flex-1 border-t border-gray-600"></div>
          </div>
          
          <div className="flex gap-4">
            <button className="flex-1 bg-transparent border border-gray-600 py-2 rounded-lg flex items-center justify-center hover:bg-gray-800">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-5 h-5" alt="Google" />
            </button>
            <button className="flex-1 bg-transparent border border-gray-600 py-2 rounded-lg flex items-center justify-center hover:bg-gray-800">
              <img src="https://www.svgrepo.com/show/475656/facebook-color.svg" className="w-5 h-5" alt="Facebook" />

  }

  return (

        <div className="flex items-center justify-between px-4 h-16">
          <button onClick={() => { setShowMenu(true); setMenuView("main"); }} className="text-3xl font-light">☰</button>
          <div onClick={() => { setPage("home"); setSearchQuery(""); setActiveCategory("All"); }} className="flex items-center gap-1 font-black text-2xl cursor-pointer tracking-tighter">
            <span className="text-brand-orange text-3xl">₿</span>
            <div className="flex flex-col leading-none"><span>itcoin</span><span className="text-lg self-end -mt-1">merch</span></div>
          </div>
          <div className="flex items-center gap-4">
            <button onClick={() => setShowSearch(!showSearch)} className="text-2xl">🔍</button>

            </div>

              <span className="text-2xl">🛒</span>
              {cart.length > 0 && (<span className="absolute -top-1 -right-2 bg-brand-orange text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">{cart.length}</span>)}
            </div>
          </div>
        </div>

      <div className={`fixed inset-0 z-50 bg-black/50 transition-opacity ${showMenu ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} onClick={() => setShowMenu(false)}>
        <div className={`w-[85%] max-w-sm bg-[#242424] text-white h-full flex flex-col overflow-y-auto drawer border-r border-gray-700 ${showMenu ? 'translate-x-0' : '-translate-x-full'}`} onClick={e => e.stopPropagation()}>
          
          <div className="bg-brand-blue text-white flex items-center justify-between px-4 h-16 sticky top-0 z-10 shrink-0">
            <button onClick={() => setShowMenu(false)} className="text-3xl">✕</button>
            <div className="flex items-center gap-1 font-black text-xl"><span className="text-brand-orange">₿</span>itcoin<span className="text-sm">merch</span></div>
            <div className="text-xl flex gap-3"><span>🔍</span><span>👤</span></div>
          </div>

          {menuView === "main" && (
            <div className="flex-1 flex flex-col">
              <nav className="flex flex-col py-2">
                <button onClick={() => setMenuView("miners")} className="px-6 py-4 border-b border-gray-700 flex justify-between items-center font-medium hover:bg-gray-800 transition">Miners <span>›</span></button>

                <button onClick={() => { setShowMenu(false); window.location.href = "https://pool.bitcoinmerch.com"; }} className="px-6 py-4 border-b border-gray-700 text-left font-medium hover:bg-gray-800 transition">Mining Pool</button>
                <button onClick={() => { setShowMenu(false); setPage("support"); }} className="px-6 py-4 border-b border-gray-700 text-left font-medium hover:bg-gray-800 transition">Support</button>
              </nav>
              <div className="p-6 border-b border-gray-700 bg-[#1a1a1a] mt-auto">
                <h3 className="font-bold text-sm tracking-widest mb-4 text-gray-400">NEED HELP?</h3>
                <div className="flex items-center gap-3 mb-4 text-sm font-medium"><span className="text-xl">📞</span> 8775000282</div>
                <div className="flex items-center gap-3 text-sm font-medium"><span className="text-xl">✉️</span> support@bitcoinmerch.com</div>
              </div>
            </div>
          )}

          {menuView === "miners" && (
            <div className="flex-1 bg-[#242424]">
              <button onClick={() => setMenuView("main")} className="px-4 py-4 text-sm font-semibold flex items-center border-b border-gray-700 w-full text-left text-brand-orange hover:bg-gray-800 transition">‹ Back</button>
              <div className="py-2">
                <button onClick={() => handleMenuClick("Miners")} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 flex items-center gap-2 hover:bg-gray-800 transition"><span className="text-yellow-500">⭐</span> Mars Lander 3 (Miner + Node)</button>
                <button onClick={() => handleMenuClick("Miners")} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Lottery Miners</button>
                <button onClick={() => handleMenuClick("Miners")} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Bitaxe & Open-Source</button>
                <button onClick={() => handleMenuClick("Miners")} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Industrial ASIC Miners</button>
              </div>
            </div>
          )}

          {menuView === "guides" && (
            <div className="flex-1 bg-[#242424]">
              <button onClick={() => setMenuView("main")} className="px-4 py-4 text-sm font-semibold flex items-center border-b border-gray-700 w-full text-left text-brand-orange hover:bg-gray-800 transition">‹ Back</button>
              <div className="py-2">
                <button onClick={() => setShowMenu(false)} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Guides</button>
                <button onClick={() => setShowMenu(false)} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Video Guides</button>
                <button onClick={() => setShowMenu(false)} className="w-full text-left px-6 py-4 text-sm font-medium border-b border-gray-800 hover:bg-gray-800 transition">Firmware Flasher</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {page === "home" && (
        <main>
          <div className="bg-[#111] text-white p-6 text-center border-b border-gray-800">
            <span className="bg-brand-orange text-white text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block">NOV 1 - DEC 3</span>
            <h1 className="text-3xl font-black leading-tight mb-2">BFCM SALE LIVE<br/><span className="text-brand-orange">FREE SHIPPING</span></h1>
            <p className="text-xs text-gray-400">USA $199+ · Int'l $1,000+</p>
          </div>
          
          <div className="bg-dark-bg px-4 py-6 border-b border-gray-800 text-center">
            <h2 className="text-2xl font-bold mb-4">Premium Mining Hardware</h2>
          </div>

          <div className="flex items-center justify-between px-4 py-3 border-b border-gray-800">
            <button className="flex items-center gap-1 text-sm font-medium text-gray-300">Sort by ▾</button>
            <div className="flex gap-3 text-lg text-gray-500"><span className="text-brand-blue">▦</span><span>☰</span></div>
          </div>
          
          <div className="px-2 py-3 border-b border-gray-800 flex gap-2 overflow-x-auto whitespace-nowrap scrollbar-hide bg-dark-bg">
            {["All", "Miners", "Accessories", "Merch"].map(cat => (
              <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-semibold border ${activeCategory === cat ? 'bg-brand-orange text-white border-brand-orange' : 'bg-transparent text-gray-400 border-gray-600'}`}>{cat}</button>
            ))}
          </div>
          
          {filteredProducts.length === 0 ? (
            <div className="p-8 text-center text-gray-500">No products found.</div>
          ) : (
            <section className="grid grid-cols-2 gap-4 p-4">
              {filteredProducts.map(p => (
                <article key={p.id} className="flex flex-col bg-dark-card p-3 rounded-lg border border-gray-800">
                  <div className="relative aspect-square mb-3 flex items-center justify-center overflow-hidden bg-[#1a1a1a] rounded-lg">
                    <img src={p.image} alt={p.title} className="max-h-full max-w-full object-contain glow-img" />

                  <h3 className="text-sm font-semibold leading-snug line-clamp-2 mb-2 text-white">{p.title}</h3>
                  <p className="text-white font-bold text-lg mb-1">${p.price.toFixed(2)}</p>
                  
                  <button 
                    onClick={() => handleAddToCart(p)}
                    className={`mt-auto w-full py-3 rounded-md text-sm font-bold tracking-wide transition-all duration-300 flex items-center justify-center ${
                      animatingId === p.id ? 'bg-gray-600 text-white' : 
                      animatingId === "added" && cart.includes(p) ? 'bg-green-600 text-white' : 
                      'bg-brand-orange text-white hover:bg-orange-600'
                    }`}
                  >
                    {animatingId === p.id ? "Adding..." : 
                     animatingId === "added" && cart.includes(p) ? "Added ✓" :
