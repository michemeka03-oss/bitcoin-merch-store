    const saved = localStorage.getItem("crypto_cart");
    if (saved) setCart(JSON.parse(saved));
  }, []);

  useEffect(() => {
    localStorage.setItem("crypto_cart", JSON.stringify(cart));
  }, [cart]);

  const addToCart = (product, qty = 1, selectedVariant = "Standard") => {
    const item = { ...product, cartQty: qty, selectedVariant };
    setCart(prev => [...prev, item]);
    setShowCartDrawer(true);
  };

  const removeFromCart = (indexToRemove) => {
    setCart(prev => prev.filter((_, index) => index !== indexToRemove));
  };

  const handleProductClick = (product) => {
    setSelectedProduct(product);
    setQuantity(1);
    setVariant("Standard");
    setPage("product");
  };

  const clearCart = () => setCart([]);
  
  const subtotal = cart.reduce((sum, item) => sum + (item.price * (item.cartQty || 1)), 0);
  const shippingCost = shippingMethod === "USPS" ? 119.58 : 166.95;
  const total = subtotal + (cart.length > 0 ? shippingCost : 0);

  const handleAuth = async (e) => {
    e.preventDefault();
    const email = e.target.elements.email.value;
    const password = e.target.elements.password.value;
    try {
      let cred;
      try {

              <div className="flex flex-col gap-3">
                <input 
                  type="text" 
                  placeholder="Type your message..." 
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  required
                  className="w-full bg-white text-black p-4 rounded-xl outline-none"
                />
                <button type="submit" className="bg-brand-chat text-brand-blue font-bold py-4 px-8 rounded-xl self-start">
                  Send us a message
                </button>
              </div>
            )}
          </form>
        </div>
      )}

      <a href="#" className="fixed right-0 top-1/2 -translate-y-1/2 z-30 bg-black text-white text-[10px] font-semibold py-3 px-1 [writing-mode:vertical-rl] rotate-180 tracking-widest border-l border-gray-800">★ Reviews</a>

      {showSpin && (
        <div className="fixed bottom-0 inset-x-0 z-50 bg-black text-white px-4 py-4 flex items-center justify-between shadow-[0_-10px_20px_rgba(0,0,0,0.5)] border-t border-gray-800">
          <span className="text-sm font-medium">Do You Want A Discount</span>
          <button className="bg-brand-orange text-white font-bold rounded-full px-5 py-2 text-sm shadow-md">🎰 Your prize</button>
          <button onClick={() => setShowSpin(false)} className="absolute -top-3 right-2 bg-white text-black rounded-full w-6 h-6 text-xs flex items-center justify-center border shadow-sm">✕</button>
        </div>
      )}
    </div>
  );
}

function AdminDashboard() {
  const [adminUser, setAdminUser] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [tab, setTab] = useState("orders");
  const [orders, setOrders] = useState([]);
  const [messages, setMessages] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (!u) { setAdminUser(null); setLoading(false); return; }
      const doc = await db.collection("users").doc(u.uid).get();
      if (doc.exists && doc.data().isAdmin === true) {
        setAdminUser(u);
        loadAll();
      } else {
        setErr("This account is not an admin.");
        await auth.signOut();
        setAdminUser(null);
      }
      setLoading(false);
    });
    return () => unsub();
  }, []);

  const loadAll = async () => {
    setLoading(true);
    const [o, m, u] = await Promise.all([
      db.collection("orders").orderBy("createdAt", "desc").limit(100).get(),
      db.collection("messages").orderBy("createdAt", "desc").limit(100).get(),
      db.collection("users").orderBy("createdAt", "desc").limit(100).get()
    ]);
    setOrders(o.docs.map(d => ({ id: d.id, ...d.data() })));
    setMessages(m.docs.map(d => ({ id: d.id, ...d.data() })));
    setUsers(u.docs.map(d => ({ id: d.id, ...d.data() })));
    setLoading(false);
  };

  const login = async (e) => {
    e.preventDefault();
    setErr("");
    try { await auth.signInWithEmailAndPassword(email, password); } 
    catch (e2) { setErr(e2.message); }
  };

  const markOrderPaid = async (id) => {
    await db.collection("orders").doc(id).update({ status: "paid" });
    loadAll();
  };

  const markMessageRead = async (id) => {
    await db.collection("messages").doc(id).update({ read: true });
    loadAll();
  };

  if (loading) return <div className="p-10 text-center font-bold">Loading...</div>;

  if (!adminUser) return (
    <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
      <form onSubmit={login} className="bg-white p-8 rounded-xl shadow-xl w-full max-w-sm">
        <h1 className="text-2xl font-bold mb-6 text-black">Admin Login</h1>
        {err && <div className="bg-red-50 text-red-700 text-sm p-3 rounded mb-4">{err}</div>}
        <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="admin@email.com" required className="w-full border p-3 rounded-lg mb-3 outline-none text-black" />
        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" required className="w-full border p-3 rounded-lg mb-4 outline-none text-black" />
        <button className="w-full bg-brand-orange text-white font-bold py-3 rounded-lg hover:bg-orange-600">Sign in</button>
      </form>
    </div>
  );

  return (
    <div className="min-h-screen bg-gray-50 pb-10">
      <header className="bg-brand-blue text-white px-6 py-4 flex justify-between items-center">
        <div className="font-black text-xl text-brand-orange">₿ Admin Panel</div>
        <button onClick={() => auth.signOut()} className="bg-white/20 px-3 py-1.5 rounded text-sm hover:bg-white/30">Log out</button>
      </header>
      <div className="max-w-4xl mx-auto p-4 mt-4">
        <div className="flex gap-4 mb-6 border-b">
          {["orders", "messages", "users"].map(k => (
            <button key={k} onClick={() => setTab(k)} className={`px-2 py-2 font-bold uppercase text-sm border-b-2 ${tab === k ? "border-brand-orange text-brand-orange" : "border-transparent text-gray-500"}`}>{k}</button>
          ))}
          <button onClick={loadAll} className="ml-auto text-sm text-blue-600 font-bold">↻ Refresh</button>
        </div>

        {tab === "orders" && orders.map(o => (
          <div key={o.id} className="bg-white rounded-lg shadow border p-4 mb-3">
            <div className="flex justify-between mb-2">
              <span className="font-bold text-sm text-black">{o.email}</span>
              <span className="font-bold text-green-600">${o.total?.toFixed(2)}</span>
            </div>
            <div className="text-xs text-gray-600 mb-2 bg-gray-50 p-2 rounded">{o.paymentMethod} → {o.walletAddress}</div>
            <div className="text-xs text-gray-500 flex justify-between items-center mt-3 border-t pt-2">
              <span className={`font-bold px-2 py-1 rounded ${o.status === 'paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>Status: {o.status}</span>
              {o.status !== "paid" && <button onClick={() => markOrderPaid(o.id)} className="bg-black text-white px-4 py-1.5 rounded font-bold">Mark Paid</button>}
            </div>
          </div>
        ))}

        {tab === "messages" && messages.map(m => (
          <div key={m.id} className={`bg-white rounded-lg shadow border p-4 mb-3 ${!m.read ? "border-l-4 border-l-brand-orange" : ""}`}>
            <div className="flex justify-between mb-1">
              <span className="font-bold text-sm text-black">{m.name} <br/><span className="text-gray-500 font-normal">{m.email}</span></span>
              {!m.read && <button onClick={() => markMessageRead(m.id)} className="text-xs bg-blue-600 text-white px-3 py-1 rounded h-fit">Mark Read</button>}
            </div>
            <p className="text-sm text-gray-800 mt-2 bg-gray-50 p-2 rounded">{m.message}</p>
          </div>
        ))}

        {tab === "users" && (
          <div className="bg-white shadow border rounded-lg overflow-hidden">
            <table className="w-full text-sm text-left text-black">
              <thead className="bg-gray-100"><tr><th className="p-3">Email</th><th className="p-3">Admin?</th></tr></thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.id} className="border-t"><td className="p-3">{u.email}</td><td className="p-3">{u.isAdmin ? "✅" : "—"}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
