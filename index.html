            <a href="mailto:support@bitcoinmerch.com" className="bg-brand-blue/10 text-brand-blue font-medium py-2 px-6 rounded inline-block">Send email</a>
          </div>
          <button onClick={() => setPage("home")} className="w-full mt-8 text-brand-blue font-bold">← Back to Store</button>
        </main>
      )}

      {page === "checkout" && (
        <main className="p-4 max-w-md mx-auto mt-4">
          <h1 className="text-2xl font-bold mb-6">Checkout</h1>
          {cart.length === 0 ? (
            <div className="text-center p-8 bg-white rounded shadow">
              <p className="mb-4">Your cart is empty.</p>
              <button onClick={() => setPage("home")} className="bg-brand-blue text-white px-6 py-2 rounded">Go back to store</button>
            </div>
          ) : (
            <>
              <div className="bg-white p-4 rounded-lg shadow-sm mb-6 border">
                <h2 className="font-bold mb-4 border-b pb-2">Order Summary</h2>
                {cart.map((item, index) => (
                  <div key={index} className="flex justify-between text-sm mb-2 text-gray-700">
                    <span className="truncate pr-4">{item.title}</span>
                    <span>${item.price.toFixed(2)}</span>
                  </div>
                ))}
                <div className="border-t mt-4 pt-2 flex justify-between font-bold text-lg text-brand-blue">
                  <span>Total:</span>
                  <span>${total.toFixed(2)}</span>
                </div>
              </div>
              <form onSubmit={(e) => { e.preventDefault(); setPage("success"); }} className="bg-white p-4 rounded-lg shadow-sm border">
                <label className="block text-sm font-bold mb-2 text-gray-700">Select Payment Method</label>
                <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="w-full border p-3 rounded mb-4 bg-gray-50 font-medium outline-none focus:border-brand-blue">
                  <option value="BTC">Bitcoin (BTC)</option>
                  <option value="ETH">Ethereum (ETH)</option>
                  <option value="SOL">Solana (SOL)</option>
                  <option value="USDT_TRC20">USDT (TRC20)</option>
                  <option value="USDT_BEP20">USDT (BEP20)</option>
                  <option value="USDT_SOL">USDT (Solana)</option>
                </select>
                <button type="submit" className="w-full bg-black hover:bg-gray-800 text-white font-bold py-4 rounded transition">Generate Payment Address</button>
              </form>
            </>
          )}
        </main>
      )}

      {page === "success" && (
        <main className="p-4 max-w-md mx-auto mt-8">
          <div className="bg-white p-6 rounded-lg shadow-lg border text-center">
            <div className="text-5xl mb-4">⏳</div>
            <h1 className="text-2xl font-bold text-brand-blue mb-2">Order Pending</h1>
            <p className="text-sm text-gray-600 mb-6">Send exactly <strong>${total.toFixed(2)}</strong> in <strong>{paymentMethod.replace('_', ' ')}</strong> to the address below.</p>
            <div className="bg-gray-100 p-4 rounded border font-mono text-sm break-all mb-4 select-all cursor-pointer">{WALLETS[paymentMethod]}</div>
            <p className="text-xs text-gray-500 mb-6">Once sent, please email your transaction hash to support@bitcoinmerch.com to approve your order.</p>
            <button onClick={() => { clearCart(); setPage("home"); }} className="w-full bg-brand-blue text-white font-bold py-3 rounded">Return to Store</button>
          </div>
        </main>
      )}

      <button onClick={() => setShowChat(true)} className="fixed bottom-20 left-4 z-30 bg-brand-chat text-brand-blue rounded-full w-14 h-14 shadow-lg text-2xl flex items-center justify-center border-2 border-white">💬</button>

      {showChat && (
        <div className="fixed inset-0 z-[60] bg-brand-blue flex flex-col text-white p-6">
          <div className="flex justify-end">
            <button onClick={() => setShowChat(false)} className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-xl">✕</button>
          </div>
          <div className="flex-1 flex flex-col items-center justify-center">
            <div className="bg-white px-4 py-2 rounded-md mb-6 inline-flex items-center gap-1 shadow-lg">
              <span className="text-brand-orange font-black text-3xl">₿</span>
              <span className="font-black text-2xl text-black leading-none">itcoin merch</span>
            </div>
            <h2 className="text-lg font-medium mb-12">We are online - How can we help?</h2>
          </div>
          <button className="bg-brand-chat text-brand-blue font-medium py-4 px-6 rounded-full self-start mb-8">Send us a message</button>
        </div>
      )}

      <a href="#" className="fixed right-0 top-1/2 -translate-y-1/2 z-30 bg-black text-white text-[10px] font-semibold py-3 px-1 [writing-mode:vertical-rl] rotate-180 tracking-widest">★ Reviews</a>

      {showSpin && (
        <div className="fixed bottom-0 inset-x-0 z-50 bg-black text-white px-4 py-4 flex items-center justify-between shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
          <span className="text-sm font-medium">Do You Want A Discount</span>
          <button className="bg-brand-orange text-white font-bold rounded-full px-5 py-2 text-sm shadow-md">🎰 Spin to win</button>
          <button onClick={() => setShowSpin(false)} className="absolute -top-3 right-2 bg-white text-black rounded-full w-6 h-6 text-xs flex items-center justify-center border shadow-sm">✕</button>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
